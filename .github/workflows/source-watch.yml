name: COT Atlas Data Source Watch
on:
  schedule:
    - cron: '47 11 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cot-atlas-source-watch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without push credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Parquet dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate pinned expiry files and seven CFTC feeds
        id: health
        continue-on-error: true
        run: |
          node scripts/check_source_integrity.mjs > source-health.json
          cat source-health.json
      - name: Open one issue on regressions; close after recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH_STATUS: ${{ steps.health.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title='[source-watch] COT Atlas data integrity alert'
          issue="$(gh issue list -R "$GH_REPO" --state open --limit 100 --json number,title --jq '.[] | select(.title == "[source-watch] COT Atlas data integrity alert") | .number' | head -n 1)"
          if [[ "$HEALTH_STATUS" != "success" ]]; then
            if [[ ! -s source-health.json ]]; then
              printf 'Source integrity watchdog could not produce a health report.\n' > source-health.json
            fi
            if [[ -z "$issue" ]]; then
              gh issue create -R "$GH_REPO" --title "$title" --body-file source-health.json
            fi
            echo 'Pinned market data or CFTC archive integrity failed; inspect issue.' >&2
            exit 1
          fi
          if [[ -n "$issue" ]]; then
            gh issue close "$issue" -R "$GH_REPO" --comment 'Recovered: all 4 pinned ES sources, NQ sample and CFTC archive pass.'
          fi
          echo 'All watched sources OK.'
