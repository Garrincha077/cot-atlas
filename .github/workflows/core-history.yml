name: Full CFTC flagship history (1986–present)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_core_history.py'
      - 'core-markets.js'
      - '.github/workflows/core-history.yml'
  schedule:
    - cron: '47 20 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cot-core-history
  cancel-in-progress: false

jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile scripts/build_core_history.py
      - name: Fetch CFTC official historical API
        run: python -u scripts/build_core_history.py
      - name: Validate archive integrity and content
        run: |
          python - <<'PY'
          import json,sqlite3,gzip
          from pathlib import Path
          m=json.loads(Path("data/core-history-manifest.json").read_text())
          assert len(m["coverage"])==7, "Missing one or more CFTC report datasets"
          assert m["total_position_rows"]>=10000, "History unexpectedly sparse"
          with gzip.open("data/core-history.sqlite3.gz","rb") as f:
              assert f.read(16)==b"SQLite format 3\x00"
          print("Verified CFTC positions:", m["total_position_rows"])
          for line in m["coverage"]:
              print(line["report"],line["first"],line["last"],line["contracts"])
          PY
      - name: Commit historical archive and provenance manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/core-history.sqlite3.gz
          git add data/core-history-manifest.json
          if git diff --staged --quiet; then
            echo "Archive unchanged"
          else
            git commit -m "data: validated multi-decade official CFTC flagship archive"
            git push origin HEAD:main
          fi
