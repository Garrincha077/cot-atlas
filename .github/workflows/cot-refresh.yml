name: COT Atlas weekly CFTC archive
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_snapshot.py'
      - 'scripts/capture_vintage.py'
      - 'tests/test_archives.py'
      - '.github/workflows/cot-refresh.yml'
  schedule:
    - cron: '17 23 * * 5'
    - cron: '37 10 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cot-atlas-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile scripts/update_snapshot.py scripts/capture_vintage.py
      - name: Fetch and validate seven CFTC datasets
        run: python -u scripts/update_snapshot.py
      - name: Capture first-observed CFTC vintages
        run: python -u scripts/capture_vintage.py
      - name: Verify archive consistency and vintages
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish immutable revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/cot.sqlite3.gz
          git add data/manifest.json
          git add data/vintages/
          if git diff --staged --quiet; then
            echo 'No data changes'
          else
            git commit -m 'data: weekly CFTC archive (all seven reports)'
            git push origin HEAD:main
          fi
